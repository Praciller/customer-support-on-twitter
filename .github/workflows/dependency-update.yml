name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
    
    - name: Update Python dependencies
      run: |
        cd backend
        pip install --upgrade pip pip-tools
        pip-compile --upgrade requirements.in || echo "No requirements.in found, skipping Python updates"
    
    - name: Update Node.js dependencies
      run: |
        cd frontend
        npm update
        npm audit fix --force || echo "No critical vulnerabilities to fix"
    
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies'
        title: 'Automated Dependency Updates'
        body: |
          This PR contains automated dependency updates.
          
          ## Changes
          - Updated Python dependencies in backend/
          - Updated Node.js dependencies in frontend/
          
          Please review the changes and ensure all tests pass before merging.
        branch: automated-dependency-updates
        delete-branch: true
